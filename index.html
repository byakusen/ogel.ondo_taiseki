<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ものの温度と体積｜4年 理科</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#17324A;
  --ink-soft:#5A7085;
  --paper:#E9EFF3;
  --card:#FFFFFF;
  --line:#D3DEE6;
  --maru:#D0342C;

  --air:#1F9CBC;
  --water:#2C5FC7;
  --metal:#C0651C;
  --sum:#6B4AA6;
  --life:#2E8B57;

  --accent:var(--air);
  --accent-tint:rgba(31,156,188,.12);

  --r:18px;
  --pad:clamp(10px,1.6vh,20px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:"Zen Kaku Gothic New",system-ui,sans-serif;
  font-weight:500;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}

/* ---------- 全体レイアウト（1画面に収める） ---------- */
.app{
  height:100dvh;
  display:flex;
  flex-direction:column;
  gap:clamp(6px,1vh,12px);
  padding:clamp(8px,1.4vh,18px) clamp(10px,2.2vw,26px) clamp(10px,1.6vh,20px);
  max-width:1080px;
  margin:0 auto;
}

/* ---------- ヘッダー ---------- */
.head{display:flex;align-items:baseline;gap:12px;flex:0 0 auto}
.head h1{
  font-family:"Zen Maru Gothic",sans-serif;
  font-weight:900;
  font-size:clamp(20px,3.1vh,31px);
  letter-spacing:.04em;
}
.head .sub{
  font-size:clamp(12px,1.7vh,16px);
  color:var(--ink-soft);
  font-weight:700;letter-spacing:.12em;
}

/* ---------- タブ ---------- */
.tabs{
  flex:0 0 auto;
  display:grid;
  grid-auto-flow:column;
  grid-auto-columns:1fr;
  gap:clamp(4px,.8vw,10px);
}
.tab{
  font-family:"Zen Maru Gothic",sans-serif;
  font-weight:700;
  font-size:clamp(13px,2.1vh,20px);
  line-height:1.25;
  letter-spacing:.01em;
  padding:clamp(7px,1.3vh,14px) 4px;
  border:2px solid var(--line);
  border-bottom-width:4px;
  border-radius:14px;
  background:#fff;
  color:var(--ink-soft);
  cursor:pointer;
  transition:transform .12s ease,color .2s,border-color .2s,background .2s;
}
.tab:hover{transform:translateY(-2px)}
.tab[aria-selected="true"]{
  color:#fff;
  background:var(--tabcolor);
  border-color:var(--tabcolor);
}
.tab:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

/* ---------- 温度計プログレス（この画面のしるし） ---------- */
.thermo{
  flex:0 0 auto;
  display:flex;align-items:center;gap:10px;
}
.thermo .bulb{
  width:clamp(18px,2.6vh,26px);height:clamp(18px,2.6vh,26px);
  border-radius:50%;flex:0 0 auto;
  background:var(--accent);
  box-shadow:0 0 0 3px #fff,0 0 0 5px var(--accent);
}
.tube{
  position:relative;flex:1;
  height:clamp(12px,1.8vh,18px);
  background:#fff;
  border:2px solid var(--line);
  border-radius:999px;
  overflow:hidden;
}
.mercury{
  position:absolute;inset:0 auto 0 0;width:0%;
  background:var(--accent);
  border-radius:999px;
  transition:width .5s cubic-bezier(.2,.9,.3,1);
}
.ticks{position:absolute;inset:0;display:flex}
.ticks span{flex:1;border-right:2px solid var(--line)}
.ticks span:last-child{border-right:0}
.thermo .count{
  font-family:"Zen Maru Gothic",sans-serif;font-weight:900;
  font-size:clamp(14px,2.1vh,20px);color:var(--accent);
  min-width:3.6em;text-align:right;
}

/* ---------- 問題カード ---------- */
.card{
  flex:1 1 auto;min-height:0;
  background:var(--card);
  border:2px solid var(--line);
  border-radius:var(--r);
  padding:var(--pad) clamp(12px,2.4vw,28px);
  display:flex;flex-direction:column;
  position:relative;overflow:hidden;
}
.qhead{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.qno{
  font-family:"Zen Maru Gothic",sans-serif;font-weight:900;
  font-size:clamp(13px,1.9vh,18px);
  color:#fff;background:var(--accent);
  padding:3px 12px;border-radius:999px;letter-spacing:.08em;
}
.qtopic{font-size:clamp(12px,1.8vh,17px);color:var(--ink-soft);font-weight:700}

.qtext{
  flex:0 0 auto;
  font-family:"Zen Maru Gothic",sans-serif;
  font-weight:700;
  font-size:clamp(19px,3.3vh,34px);
  line-height:1.5;
  margin:clamp(6px,1.4vh,16px) 0 clamp(8px,1.6vh,18px);
}
/* ---------- 実験／問題 の切りかえ ---------- */
[hidden]{display:none!important}
.quizview{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.subtabs{
  flex:0 0 auto;display:flex;gap:8px;
  margin-bottom:clamp(6px,1.2vh,14px);
}
.subtab{
  font-family:"Zen Maru Gothic",sans-serif;font-weight:900;
  font-size:clamp(15px,2.3vh,23px);
  padding:clamp(6px,1.1vh,12px) clamp(16px,2.4vw,28px);
  border:2px solid var(--accent);border-radius:999px;
  background:#fff;color:var(--accent);cursor:pointer;
  transition:background .2s,color .2s;
}
.subtab[aria-selected="true"]{background:var(--accent);color:#fff}
.subtab:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

/* ---------- 実験 ---------- */
.expview{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;position:relative}
.exppick{
  flex:0 0 auto;display:flex;flex-wrap:wrap;gap:6px;
  margin-bottom:clamp(4px,.9vh,10px);
}
.pick{
  font-family:"Zen Maru Gothic",sans-serif;font-weight:700;
  font-size:clamp(16px,2.6vh,27px);
  padding:clamp(6px,1.1vh,13px) clamp(12px,1.8vw,22px);
  border:2px solid var(--line);border-radius:10px;
  background:#fff;color:var(--ink-soft);cursor:pointer;
}
.pick[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-tint)}
.pick:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.expfoot{
  flex:0 0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  min-height:clamp(40px,6vh,58px);
  margin-top:clamp(4px,.9vh,10px);
}
.expacts{display:flex;gap:8px;flex-wrap:wrap}
.heat{
  font-family:"Zen Maru Gothic",sans-serif;font-weight:900;
  font-size:clamp(15px,2.4vh,24px);
  padding:clamp(8px,1.5vh,16px) clamp(18px,2.6vw,30px);
  border:none;border-radius:999px;background:#D0342C;color:#fff;cursor:pointer;
  box-shadow:0 4px 0 rgba(0,0,0,.18);
}
.heat:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.heat:disabled{background:#B9C6D0;box-shadow:none;cursor:default}
.reset{
  font-family:"Zen Maru Gothic",sans-serif;font-weight:700;
  font-size:clamp(14px,2.1vh,20px);
  padding:clamp(7px,1.3vh,13px) clamp(14px,2vw,22px);
  border:2px solid var(--line);border-radius:999px;background:#fff;color:var(--ink-soft);cursor:pointer;
}
.expmsg{
  flex:1 1 260px;font-size:clamp(14px,2.1vh,20px);font-weight:700;line-height:1.4;color:var(--ink-soft);
}
.expmsg.found{color:var(--maru)}
  12%{opacity:.95}
  85%{opacity:.95}
  100%{transform:translateY(-150px);opacity:0}
}

.qtext em{font-style:normal;background:linear-gradient(transparent 62%,var(--accent-tint) 62%);padding:0 2px}

/* ---------- 図（示温シールの実験など） ---------- */
.body{
  flex:1 1 auto;min-height:0;
  display:flex;flex-direction:column;justify-content:center;
  gap:clamp(6px,1.4vh,16px);
}
.figure{
  flex:1 1 auto;min-height:0;
  display:flex;align-items:center;justify-content:center;
}
.figure svg{width:100%;height:100%;max-width:100%}
.figure svg text{font-family:"Zen Maru Gothic",sans-serif;font-weight:900}

.choices{
  flex:0 0 auto;
  display:grid;gap:clamp(6px,1.2vh,12px);
  grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));
  align-content:center;
}
.choice{
  font-family:"Zen Maru Gothic",sans-serif;font-weight:700;
  font-size:clamp(17px,2.6vh,27px);
  line-height:1.35;
  text-align:left;
  padding:clamp(9px,1.7vh,18px) clamp(12px,1.6vw,18px);
  background:#fff;color:var(--ink);
  border:2px solid var(--line);border-bottom-width:5px;
  border-radius:14px;cursor:pointer;
  display:flex;align-items:center;gap:10px;
  transition:transform .12s,border-color .2s,background .2s;
}
.choice .mark{
  flex:0 0 auto;
  width:1.7em;height:1.7em;border-radius:50%;
  display:grid;place-items:center;
  background:var(--accent-tint);color:var(--accent);
  font-size:.8em;font-weight:900;
}
.choice:hover:not(:disabled){transform:translateY(-2px);border-color:var(--accent)}
.choice:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.choice:disabled{cursor:default}
.choice.correct{background:#FFF3F2;border-color:var(--maru);color:var(--maru)}
.choice.correct .mark{background:var(--maru);color:#fff}
.choice.wrong{opacity:.45;animation:shake .34s}
.choice.dim{opacity:.4}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-7px)}45%{transform:translateX(6px)}
  70%{transform:translateX(-4px)}
}

/* ---------- 判定・かいせつ ---------- */
.foot{
  flex:0 0 auto;
  min-height:clamp(44px,7vh,64px);
  display:flex;align-items:center;gap:12px;
  margin-top:clamp(6px,1.2vh,14px);
}
.msg{
  flex:1;
  font-size:clamp(14px,2.3vh,22px);
  font-weight:700;line-height:1.4;
  opacity:0;transform:translateY(6px);
  transition:opacity .3s,transform .3s;
}
.msg.show{opacity:1;transform:none}
.msg.ok{color:var(--maru)}
.msg.ng{color:var(--ink-soft)}
.msg b{font-family:"Zen Maru Gothic",sans-serif;font-weight:900}

.hint{
  flex:0 0 auto;
  font-family:"Zen Maru Gothic",sans-serif;font-weight:900;
  font-size:clamp(14px,2.1vh,21px);
  padding:clamp(7px,1.3vh,13px) clamp(14px,2vw,24px);
  border:3px solid var(--accent);border-radius:999px;
  background:#fff;color:var(--accent);cursor:pointer;
}
.hint:hover{background:var(--accent-tint)}
.hint:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.msg.tip{color:var(--ink-soft)}

.next{
  flex:0 0 auto;
  font-family:"Zen Maru Gothic",sans-serif;font-weight:900;
  font-size:clamp(16px,2.5vh,25px);
  padding:clamp(9px,1.6vh,17px) clamp(18px,2.6vw,30px);
  border:none;border-radius:999px;
  background:var(--accent);color:#fff;cursor:pointer;
  box-shadow:0 4px 0 rgba(0,0,0,.18);
  opacity:0;pointer-events:none;transition:opacity .3s,transform .1s;
}
.next.show{opacity:1;pointer-events:auto}
.next:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.next:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

/* ---------- 予想（実験の前に出るパネル） ---------- */
.guessbox{
  position:absolute;inset:0;z-index:5;
  background:rgba(255,255,255,.97);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(6px,1.4vh,14px);text-align:center;padding:4px;
}
.guessbox .gtitle{
  font-family:"Zen Maru Gothic",sans-serif;font-weight:900;
  font-size:clamp(13px,1.9vh,19px);letter-spacing:.12em;
  color:#fff;background:var(--accent);padding:4px 18px;border-radius:999px;
}
.guessbox .gq{
  font-family:"Zen Maru Gothic",sans-serif;font-weight:700;
  font-size:clamp(18px,3vh,30px);line-height:1.45;
  max-width:900px;
}
.guessbox .gc{
  display:grid;gap:clamp(6px,1.2vh,12px);width:min(100%,780px);
  grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));
}
.gchoice{
  font-family:"Zen Maru Gothic",sans-serif;font-weight:700;
  font-size:clamp(16px,2.4vh,25px);line-height:1.35;text-align:left;
  padding:clamp(8px,1.5vh,16px) clamp(12px,1.6vw,18px);
  background:#fff;color:var(--ink);
  border:2px solid var(--line);border-bottom-width:5px;border-radius:14px;
  cursor:pointer;display:flex;align-items:center;gap:10px;
  transition:transform .12s,border-color .2s;
}
.gchoice:hover{transform:translateY(-2px);border-color:var(--accent)}
.gchoice:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.gchoice .mark{
  flex:0 0 auto;width:1.7em;height:1.7em;border-radius:50%;
  display:grid;place-items:center;
  background:var(--accent-tint);color:var(--accent);
  font-size:.8em;font-weight:900;
}
.guessbox .ghelp{
  font-size:clamp(12px,1.7vh,16px);color:var(--ink-soft);font-weight:700;
}
.expmsg .yosou{
  display:block;font-size:.86em;line-height:1.3;
  color:var(--ink-soft);font-weight:900;
  font-family:"Zen Maru Gothic",sans-serif;
}

<script>
/* ============================================================
   図をかく部品（ここはさわらなくてOK）
   tubeFig()     … せっけん水のまくをはった試験管（あ・い）
   jellyThree()  … ガラス管のゼリーの位置（カ・キ・ク）
   ============================================================ */
function tag(x,y,t){
  return '<g><circle cx="'+x+'" cy="'+y+'" r="19" fill="#fff" stroke="#17324A" stroke-width="3"/>'+
         '<text x="'+x+'" y="'+(y+8)+'" text-anchor="middle" font-size="26" fill="#17324A">'+t+'</text></g>';
}
/* --- 試験管と、にぎる両手 --- */
const TB={top:44,bot:600,hw:34,H:620};
const SKIN="#F5C0A0", SHADE="#E09B78";
function filmPath(cx,b){
  const y=TB.top,x1=cx-TB.hw,x2=cx+TB.hw;
  return 'M'+x1+' '+y+' Q'+cx+' '+(y-2*b)+' '+x2+' '+y+' Z';
}
/* こぶし1つ。手の甲が左、指が右、親指は右上。ty＝こぶしの上はし */
function fist(cx,ty){
  const Y=v=>ty+v;
  // りんかく（手の甲は大きくなめらか、指がわは4つのふくらみ）
  let d='M'+(cx-150)+' '+Y(40)+
        ' Q'+(cx-142)+' '+Y(2)+' '+(cx-88)+' '+Y(0)+
        ' Q'+(cx-20)+' '+Y(-4)+' '+(cx+22)+' '+Y(4)+
        ' Q'+(cx+62)+' '+Y(10)+' '+(cx+78)+' '+Y(24)+
        ' Q'+(cx+104)+' '+Y(44)+' '+(cx+80)+' '+Y(68)+
        ' Q'+(cx+106)+' '+Y(90)+' '+(cx+80)+' '+Y(114)+
        ' Q'+(cx+104)+' '+Y(136)+' '+(cx+76)+' '+Y(158)+
        ' Q'+(cx+96)+' '+Y(180)+' '+(cx+60)+' '+Y(198)+
        ' Q'+(cx+8)+' '+Y(226)+' '+(cx-62)+' '+Y(229)+
        ' Q'+(cx-132)+' '+Y(232)+' '+(cx-158)+' '+Y(184)+
        ' Q'+(cx-178)+' '+Y(128)+' '+(cx-166)+' '+Y(84)+
        ' Q'+(cx-158)+' '+Y(56)+' '+(cx-150)+' '+Y(40)+' Z';
  let s='<path d="'+d+'"/>';
  // 親指（右上に出る）
  s+='<path d="M'+(cx+30)+' '+Y(30)+
      ' Q'+(cx+34)+' '+Y(-12)+' '+(cx+72)+' '+Y(-30)+
      ' Q'+(cx+110)+' '+Y(-44)+' '+(cx+118)+' '+Y(-4)+
      ' Q'+(cx+124)+' '+Y(36)+' '+(cx+86)+' '+Y(48)+
      ' Q'+(cx+48)+' '+Y(56)+' '+(cx+30)+' '+Y(30)+' Z"/>';
  // 指の分かれ目（3本の曲線）
  const cr=[[52,-50,78,80,64],[98,-46,124,80,110],[144,-40,168,76,154]];
  cr.forEach(c=>{
    s+='<path d="M'+(cx+c[1])+' '+Y(c[0])+' Q'+(cx+16)+' '+Y(c[2])+' '+(cx+c[3])+' '+Y(c[4])+
       '" fill="none" stroke="'+SHADE+'" stroke-width="6" stroke-linecap="round"/>';
  });
  // 親指のつけね
  s+='<path d="M'+(cx+34)+' '+Y(34)+' Q'+(cx+56)+' '+Y(46)+' '+(cx+80)+' '+Y(44)+
      '" fill="none" stroke="'+SHADE+'" stroke-width="6" stroke-linecap="round"/>';
  return s;
}
function hands(cx,live){
  return '<g '+(live?'id="hands" ':'')+'fill="'+SKIN+'" stroke="#EBAF8D" stroke-width="2" stroke-linejoin="round">'+
    '<g transform="translate('+(2*cx)+',0) scale(-1,1)">'+fist(cx,340)+'</g>'+
    fist(cx,160)+
    '</g>';
}
function tubeBody(cx){
  const x1=cx-TB.hw,x2=cx+TB.hw,t=TB.top,o=TB.bot;
  return '<path d="M'+x1+' '+t+' L'+x1+' '+(o-26)+' Q'+x1+' '+o+' '+cx+' '+o+
         ' Q'+x2+' '+o+' '+x2+' '+(o-26)+' L'+x2+' '+t+
         '" fill="#F4F9FB" stroke="#BCCDD6" stroke-width="3" stroke-linecap="round"/>';
}
function tubeScene(cx,b,live){
  return tubeBody(cx)+hands(cx,live)+
    '<path '+(live?'id="film" ':'')+'d="'+filmPath(cx,b)+
    '" fill="#BFE3F2" fill-opacity=".85" stroke="#3E9BBE" stroke-width="5" stroke-linejoin="round"/>';
}
function flipG(inner){ return '<g transform="translate(0,'+TB.H+') scale(1,-1)">'+inner+'</g>'; }
function tubeFig(){
  let s='<svg viewBox="0 0 1100 620" xmlns="http://www.w3.org/2000/svg">';
  s+=tubeScene(190,0,false)+tag(60,60,"あ");
  s+='<line x1="236" y1="36" x2="220" y2="44" stroke="#17324A" stroke-width="2"/>';
  s+='<text x="244" y="42" font-size="22" fill="#17324A">せっけん水のまく</text>';
  s+='<text x="190" y="104" text-anchor="middle" font-size="20" fill="#5A7085">空気</text>';
  s+=flipG(tubeScene(730,0,false))+tag(566,60,"い");
  s+='<line x1="776" y1="584" x2="760" y2="576" stroke="#17324A" stroke-width="2"/>';
  s+='<text x="1090" y="590" text-anchor="end" font-size="22" fill="#17324A">せっけん水のまく</text>';
  s+='<text x="730" y="522" text-anchor="middle" font-size="20" fill="#5A7085">空気</text>';
  return s+'</svg>';
}
const EXP_CX=200;          /* 実験用の試験管の中心x */
const EXP_BULGE=26;        /* まくがふくらむ量 */
function expTubeSVG(dir){
  const up=dir<0, scene=tubeScene(EXP_CX,0,true);
  /* 上下に余白をとって、まくのふくらみが切れないようにする（イラストも少し小さくなる） */
  let s='<svg viewBox="0 -75 640 770" xmlns="http://www.w3.org/2000/svg">';
  s+= up ? scene : flipG(scene);
  s+='<line x1="246" y1="'+(up?36:584)+'" x2="230" y2="'+(up?44:576)+'" stroke="#17324A" stroke-width="2"/>';
  s+='<text x="254" y="'+(up?42:590)+'" font-size="23" fill="#17324A">せっけん水のまく</text>';
  s+='<text x="200" y="'+(up?104:522)+'" text-anchor="middle" font-size="21" fill="#5A7085">空気</text>';
  return s+'</svg>';
}
/* --- 丸底フラスコとゼリー --- */
const JY=129, JD=76;   /* ゼリーの初めのy位置と、動く量 */
/* hw＝管の太さ（半分）。省略すると細い管（問題の図用） */
function glassTube(x,y0,y1,hw){
  hw=hw||9;
  return '<rect x="'+(x-hw)+'" y="'+y0+'" width="'+(hw*2)+'" height="'+(y1-y0)+'" fill="#F2F8FC" stroke="#17324A" stroke-width="3"/>';
}
/* w,h＝ゼリーの大きさ。省略すると小さいゼリー（問題の図用） */
function jelly(x,y,id,w,h){
  w=w||16; h=h||16;
  return '<rect '+(id?'id="jelly" ':'')+'x="'+(x-w/2)+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="3" fill="#E8C05A" stroke="#A8842A" stroke-width="2"/>';
}
function markLine(x,y,w){
  return '<line x1="'+(x-w)+'" y1="'+y+'" x2="'+(x+w)+'" y2="'+y+'" stroke="#D0342C" stroke-width="2.5" stroke-dasharray="6 5"/>';
}
function jellyThree(){
  const set=[["カ",185],["キ",137],["ク",89]];
  let s='<svg viewBox="0 0 660 290" xmlns="http://www.w3.org/2000/svg">';
  set.forEach((v,i)=>{
    const x=110+i*220;
    s+=glassTube(x,60,232);
    s+=markLine(x,145,34);
    s+='<text x="'+(x-40)+'" y="150" text-anchor="end" font-size="20" fill="#D0342C">印</text>';
    s+=jelly(x,v[1]);
    s+='<rect x="'+(x-24)+'" y="232" width="48" height="20" rx="5" fill="#8C5A3C"/>';
    s+=tag(x,30,v[0]);
  });
  return s+'</svg>';
}
/* 水面にうかべる氷（氷水のときだけ表示） */
function iceCubes(){
  const cube=(x,y,w,r)=>'<g transform="rotate('+r+' '+(x+w/2)+' '+(y+w/2)+')">'+
    '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+w+'" rx="7" fill="#F4FBFF" stroke="#7FB6D6" stroke-width="2.5"/>'+
    '<path d="M'+(x+w*.24)+' '+(y+w*.74)+' L'+(x+w*.3)+' '+(y+w*.3)+' L'+(x+w*.7)+' '+(y+w*.3)+'"'+
    ' fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g>';
  return '<g id="ice" style="display:none">'+cube(172,362,48,-12)+cube(236,378,34,10)+cube(404,364,46,9)+'</g>';
}
function expFlaskSVG(){

const WY=140, WD=60, WB=396;   /* 初めの水面の高さ／動く量／管の中の水の下はし */

/* 輪（おくがわの帯・手前がわの帯を分けて描く） */
function ringBack(cx,cy,ro,ri){
  const rq=ro*0.33, rp=ri*0.33;
  return '<path d="M'+(cx-ro)+' '+cy+' A'+ro+' '+rq+' 0 0 1 '+(cx+ro)+' '+cy+
         ' L'+(cx+ri)+' '+cy+' A'+ri+' '+rp+' 0 0 0 '+(cx-ri)+' '+cy+' Z" fill="'+GOLD_SH+'"/>';
}
function ringFront(cx,cy,ro,ri){
  const rq=ro*0.33, rp=ri*0.33;
  return '<path d="M'+(cx-ro)+' '+cy+' A'+ro+' '+rq+' 0 0 0 '+(cx+ro)+' '+cy+
         ' L'+(cx+ri)+' '+cy+' A'+ri+' '+rp+' 0 0 1 '+(cx-ri)+' '+cy+' Z" fill="'+GOLD+'"/>';
}

/* 色をまぜる（ふつうの金色 → 熱した色） */
function mixCol(a,b,t){
  const h=c=>[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];
  const A=h(a), B=h(b);
  return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,"0")).join("");
}

/* --- 玉の位置・大きさを塗りかえる部品 --- */
function ballCenter(){ return [BX0+ballDX, BY0+ballDY]; }
function ballRestY(r){
  return r>RING_IN ? RING_Y-Math.sqrt(r*r-RING_IN*RING_IN)   /* 輪の上でとまる高さ */
                   : RING_Y-r*0.55;                          /* 輪のふちにのる高さ */
}
function clampBallPos(x,y){
  x=Math.max(110,Math.min(1240,x));
  y=Math.max(BY0-40,Math.min(FALL_Y+16,y));
  if(ballR<=RING_IN && Math.abs(x-RING_CX)<72) x=RING_CX;    /* 輪の真上へすいよせる */
  const through = ballR<=RING_IN && Math.abs(x-RING_CX)<1;
  if(!through && Math.abs(x-RING_CX)<RING_OUT+ballR) y=Math.min(y,ballRestY(ballR));
  return [x,y];
}
function moveBallTo(x,y,clamp){
  if(clamp!==false){ const p=clampBallPos(x,y); x=p[0]; y=p[1]; }
  ballDX=x-BX0; ballDY=y-BY0;
  const g=expfigEl.querySelector("#ballg");
  if(g) g.setAttribute("transform","translate("+ballDX.toFixed(1)+","+ballDY.toFixed(1)+")");
  const lab=expfigEl.querySelector("#balllabel");
  if(lab) lab.style.display = (Math.abs(ballDX)+Math.abs(ballDY)<6) ? "" : "none";
}
function paintBall(r,hotT){
  const c=expfigEl.querySelector("#ballc"), hi=expfigEl.querySelector("#ballhi"),
        gl=expfigEl.querySelector("#glow"), ch=expfigEl.querySelector("#chain"),
        lo=expfigEl.querySelector("#chainloop");
  if(!c) return;
  ballR=r;
  const hx=BX0-r*0.42, hyy=BY0-r*0.46, top=BY0-r-HANDLE;
  c.setAttribute("r",r.toFixed(1));
  c.setAttribute("fill",mixCol(GOLD,HOT,hotT));
  c.setAttribute("stroke",mixCol(GOLD_SH,HOT_SH,hotT));
  hi.setAttribute("cx",hx.toFixed(1)); hi.setAttribute("cy",hyy.toFixed(1));
  hi.setAttribute("rx",(r*0.29).toFixed(1)); hi.setAttribute("ry",(r*0.2).toFixed(1));
  hi.setAttribute("transform","rotate(-30 "+hx.toFixed(1)+" "+hyy.toFixed(1)+")");
  hi.setAttribute("fill",mixCol(GOLD_HI,HOT_HI,hotT));
  gl.setAttribute("r",(r+18).toFixed(1));
  gl.setAttribute("opacity",(hotT*0.35).toFixed(3));
  ch.setAttribute("y1",top.toFixed(1)); ch.setAttribute("y2",(BY0-r).toFixed(1));
  lo.setAttribute("cy",top.toFixed(1));
}

  set.forEach((v,i)=>{
    const cx=120+i*240, ry=190, r=v[1], dy=v[2];
    if(v[3]) s+=tag(cx,42,v[3]);
    s+='<line x1="'+cx+'" y1="86" x2="'+cx+'" y2="'+(ry+dy-r)+'" stroke="#8A9299" stroke-width="5"/>';
    s+=ringBack(cx,ry,66,42);
    s+='<circle cx="'+cx+'" cy="'+(ry+dy)+'" r="'+r+'" fill="'+(i===1?HOT:GOLD)+'" stroke="'+GOLD_SH+'" stroke-width="3"/>';
    s+='<ellipse cx="'+(cx-12)+'" cy="'+(ry+dy-13)+'" rx="9" ry="6" transform="rotate(-30 '+(cx-12)+' '+(ry+dy-13)+')" fill="'+GOLD_HI+'"/>';
    s+=ringFront(cx,ry,66,42);
    if(i===1) [-1,1].forEach(k=>{
      s+='<path d="M'+(cx+k*66)+' '+(ry+dy+26)+' q10 -14 0 -28 q-10 -14 0 -28" fill="none" stroke="'+HOT+'" stroke-width="4" stroke-linecap="round"/>';
    });
    s+='<text x="'+cx+'" y="300" text-anchor="middle" font-size="21" fill="#17324A">'+v[0]+'</text>';
  });
  return s+'</svg>';
}

/* びん1つ分の絵（ふたを下にするか／湯か氷水か） */
function jarOne(cx,lid,hot){
  const bowl='M'+(cx-74)+' 168 L'+(cx-56)+' 246 Q'+(cx-48)+' 262 '+(cx-26)+' 262'+
             ' L'+(cx+26)+' 262 Q'+(cx+48)+' 262 '+(cx+56)+' 246 L'+(cx+74)+' 168';
  const bodyY = lid?110:140, lidY = lid?214:110;
  let s='';
  s+='<rect x="'+(cx-27)+'" y="'+bodyY+'" width="54" height="104" rx="7" fill="#C0392B" stroke="#8C2A20" stroke-width="2.5"/>';
  s+='<rect x="'+(cx-20)+'" y="'+(bodyY+30)+'" width="40" height="28" rx="5" fill="#F2EBD8"/>';
  s+='<rect x="'+(cx-31)+'" y="'+lidY+'" width="62" height="30" rx="7" fill="'+GOLD+'" stroke="'+GOLD_SH+'" stroke-width="2.5"/>';
  s+='<path d="M'+(cx-70)+' 186 L'+(cx+70)+' 186 L'+(cx+58)+' 246 Q'+(cx+48)+' 262 '+(cx+26)+' 262'+
     ' L'+(cx-26)+' 262 Q'+(cx-48)+' 262 '+(cx-58)+' 246 Z" fill="'+(hot?'#F7C4A6':'#BFE3F2')+'" opacity=".72"/>';
  if(hot) [-50,50].forEach(dx=>{
    s+='<path d="M'+(cx+dx)+' 176 q9 -13 0 -26 q-9 -13 0 -26" fill="none" stroke="#E0813C" stroke-width="3.5" stroke-linecap="round" opacity=".8"/>';
  });
  else [[-46,196,22],[46,200,20],[-44,226,17]].forEach(c=>{
    s+='<rect x="'+(cx+c[0]-c[2]/2)+'" y="'+c[1]+'" width="'+c[2]+'" height="'+c[2]+'" rx="4" fill="#F4FBFF" stroke="#7FB6D6" stroke-width="2"/>';
  });
  s+='<path d="'+bowl+'" fill="none" stroke="#17324A" stroke-width="3" stroke-linejoin="round"/>';
  return s;
}
/* びんのふたを開ける方法（4つのえらびかた・問題用） */
function jarFig(){
  const set=[["ア","底","湯"],["イ","ふた","湯"],["ウ","底","氷水"],["エ","ふた","氷水"]];
  let s='<svg viewBox="0 0 780 350" xmlns="http://www.w3.org/2000/svg">';
  set.forEach((v,i)=>{
    const cx=105+i*190, lid=(v[1]==="ふた"), hot=(v[2]==="湯");
    s+=tag(cx,40,v[0]);
    s+=jarOne(cx,lid,hot);
    s+='<text x="'+cx+'" y="300" text-anchor="middle" font-size="20" fill="#17324A">びんの'+v[1]+'を</text>';
    s+='<text x="'+cx+'" y="326" text-anchor="middle" font-size="20" fill="#17324A">'+v[2]+'につける</text>';
  });
  return s+'</svg>';
}

/* 空気・水・金ぞくのくらべ（まとめ用） */
function compareFig(){
  const set=[["空気",430,"#7EC0E8"],["水",96,"#3E8FC4"],["金ぞく",20,"#C9A227"]];
  let s='<svg viewBox="0 0 720 312" xmlns="http://www.w3.org/2000/svg">';
  s+='<text x="360" y="44" text-anchor="middle" font-size="24" fill="#17324A">あたためたときの、体積のふえかた</text>';
  set.forEach((v,i)=>{
    const y=100+i*66;
    s+='<text x="150" y="'+(y+9)+'" text-anchor="end" font-size="24" fill="#17324A">'+v[0]+'</text>';
    s+='<rect x="168" y="'+(y-19)+'" width="'+Math.max(v[1],28)+'" height="36" rx="10" fill="'+v[2]+'" stroke="#17324A" stroke-width="2.5"/>';
  });
  s+='<line x1="168" y1="72" x2="168" y2="272" stroke="#8A9299" stroke-width="2" stroke-dasharray="5 5"/>';
  s+='<text x="360" y="290" text-anchor="middle" font-size="19" fill="#5A7085">ぼうが長いほど、体積の変化が大きい</text>';
  return s+'</svg>';
}

/* 絵を、決めたわくの中にきれいに入れる */
function photo(href,x,y,w,h){
  return '<image href="'+href+'" x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+
         '" preserveAspectRatio="xMidYMid meet"/>';
}
const QINK="#17324A", QSOFT="#5A7085", QRED="#D0342C", QBLUE="#2E7DA8";

/* 「？」のしるし */
function qmark(x,y,size,color){
  return '<text x="'+x+'" y="'+y+'" text-anchor="middle" font-size="'+(size||54)+
         '" fill="'+(color||QRED)+'">？</text>';
}
/* 引き出し線つきの名まえ */
function callout(tx,ty,px,py,text,anchor){
  const end = anchor==="end";
  return '<line x1="'+(tx+(end?8:-8))+'" y1="'+(ty-7)+'" x2="'+px+'" y2="'+py+'" stroke="'+QINK+'" stroke-width="2.5"/>'+
         '<text x="'+tx+'" y="'+ty+'" text-anchor="'+(end?"end":"start")+'" font-size="24" fill="'+QINK+'">'+text+'</text>';
}
/* 湯気（あたたかいしるし） */
function steam(x,y,col){
  return '<path d="M'+x+' '+y+' q10 -14 0 -28 q-10 -14 0 -26" fill="none" stroke="'+(col||"#E0813C")+
         '" stroke-width="3.5" stroke-linecap="round" opacity=".85"/>';
}
/* 入れもの（湯・氷水） */
function bowlOf(cx,top,bot,hot,w){
  w=w||74;
  const wt=top+18;
  let s='<path d="M'+(cx-w+10)+' '+wt+' L'+(cx+w-10)+' '+wt+' L'+(cx+w-24)+' '+(bot-16)+
        ' Q'+(cx+w-32)+' '+bot+' '+(cx+w-54)+' '+bot+' L'+(cx-w+54)+' '+bot+
        ' Q'+(cx-w+32)+' '+bot+' '+(cx-w+24)+' '+(bot-16)+' Z" fill="'+(hot?'#F7C4A6':'#BFE3F2')+'" opacity=".8"/>';
  if(hot) [-w+30,w-30].forEach(dx=>{ s+=steam(cx+dx,wt-10); });
  else [[-w+34,wt+8,22],[w-40,wt+14,19],[-w+40,wt+40,16]].forEach(c=>{
    s+='<rect x="'+(cx+c[0]-c[2]/2)+'" y="'+c[1]+'" width="'+c[2]+'" height="'+c[2]+'" rx="4" fill="#F4FBFF" stroke="#7FB6D6" stroke-width="2"/>';
  });
  s+='<path d="M'+(cx-w)+' '+top+' L'+(cx-w+24)+' '+(bot-16)+' Q'+(cx-w+32)+' '+bot+' '+(cx-w+54)+' '+bot+
     ' L'+(cx+w-54)+' '+bot+' Q'+(cx+w-32)+' '+bot+' '+(cx+w-24)+' '+(bot-16)+' L'+(cx+w)+' '+top+
     '" fill="none" stroke="'+QINK+'" stroke-width="3" stroke-linejoin="round"/>';
  return s;
}
/* 丸底フラスコのアイコン（中の色をかえて使う） */
function flaskIcon(cx,cy,fill,tubeText){
  let s='';
  s+='<rect x="'+(cx-11)+'" y="'+(cy-96)+'" width="22" height="70" fill="#F2F8FC" stroke="'+QINK+'" stroke-width="3"/>';
  s+='<circle cx="'+cx+'" cy="'+(cy+2)+'" r="46" fill="'+(fill||"#EAF6FC")+'" stroke="'+QINK+'" stroke-width="3"/>';
  if(tubeText){
    s+='<line x1="'+(cx-13)+'" y1="'+(cy-56)+'" x2="'+(cx+13)+'" y2="'+(cy-56)+'" stroke="'+QRED+'" stroke-width="3" stroke-dasharray="5 4"/>';
    s+='<text x="'+(cx+26)+'" y="'+(cy-46)+'" font-size="30" fill="'+QRED+'">'+tubeText+'</text>';
  }
  return s;
}
/* 金ぞくの玉のアイコン */
function ballIcon(cx,cy,r,hot){
  return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(hot?HOT:GOLD)+'" stroke="'+(hot?HOT_SH:GOLD_SH)+'" stroke-width="3"/>'+
         '<ellipse cx="'+(cx-r*0.4)+'" cy="'+(cy-r*0.42)+'" rx="'+(r*0.28)+'" ry="'+(r*0.19)+
         '" transform="rotate(-30 '+(cx-r*0.4)+' '+(cy-r*0.42)+')" fill="'+(hot?HOT_HI:GOLD_HI)+'"/>';
}

/* ① 試験管のどこが変わった？（空気・何の体積） */
function partsTubeFig(){
  const cx=330, hw=34, top=110, bot=282;
  let s='<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg">';
  s+='<rect x="'+(cx-hw)+'" y="'+top+'" width="'+(hw*2)+'" height="'+(bot-top-18)+'" fill="#EAF6FC" stroke="'+QINK+'" stroke-width="4"/>';
  s+='<path d="M'+(cx-hw)+' '+(bot-18)+' q'+hw+' 30 '+(hw*2)+' 0" fill="#EAF6FC" stroke="'+QINK+'" stroke-width="4"/>';
  s+='<path d="M'+(cx-hw)+' '+top+' q'+hw+' -60 '+(hw*2)+' 0" fill="#DCEFFA" stroke="'+QINK+'" stroke-width="3.5"/>';
  s+=callout(228,86,296,92,"せっけん水のまく","end");
  s+=callout(452,196,368,196,"空気","start");
  s+=callout(228,262,294,254,"試験管","end");
  s+=qmark(560,300,44);
  s+='<text x="350" y="40" text-anchor="middle" font-size="24" fill="'+QSOFT+'">あたためられて、体積がかわったのはどれ？</text>';
  return s+'</svg>';
}
/* ② はじめ と あたためたあと（空気の何がかわった） */
function whatChangeFig(){
  const set=[[190,"はじめ",0],[500,"あたためたあと",44]];
  let s='<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg">';
  set.forEach(v=>{
    const cx=v[0], hw=32, top=120, bot=274, b=v[2];
    s+='<rect x="'+(cx-hw)+'" y="'+top+'" width="'+(hw*2)+'" height="'+(bot-top-16)+'" fill="#EAF6FC" stroke="'+QINK+'" stroke-width="4"/>';
    s+='<path d="M'+(cx-hw)+' '+(bot-16)+' q'+hw+' 28 '+(hw*2)+' 0" fill="#EAF6FC" stroke="'+QINK+'" stroke-width="4"/>';
    s+='<path d="M'+(cx-hw)+' '+top+' q'+hw+' '+(-16-b*1.2)+' '+(hw*2)+' 0" fill="#DCEFFA" stroke="'+QINK+'" stroke-width="3.5"/>';
    s+='<text x="'+cx+'" y="306" text-anchor="middle" font-size="23" fill="'+QINK+'">'+v[1]+'</text>';
  });
  s+='<path d="M300 200 L390 200" stroke="'+QRED+'" stroke-width="7" stroke-linecap="round"/>';
  s+='<path d="M372 186 L392 200 L372 214 Z" fill="'+QRED+'"/>';
  s+='<text x="346" y="170" text-anchor="middle" font-size="22" fill="'+QRED+'">あたためる</text>';
  s+='<text x="350" y="46" text-anchor="middle" font-size="24" fill="'+QSOFT+'">空気の何がかわった？</text>';
  s+=qmark(628,230,50);
  return s+'</svg>';
}
/* ③ あたためる／冷やす と 体積（まとめ用・4しゅるい） */
function warmCoolFig(kind){
  const pack=(cx,cy)=>{
    if(kind==="air")   return flaskIcon(cx,cy,"#EAF6FC");
    if(kind==="water") return flaskIcon(cx,cy,"#9CCFEA");
    if(kind==="metal") return ballIcon(cx,cy,44,false);
    return flaskIcon(cx-104,cy,"#EAF6FC")+flaskIcon(cx,cy,"#9CCFEA")+ballIcon(cx+104,cy+2,42,false);
  };
  const wide = (kind==="all");
  const W = wide?820:640, half=W/2;
  let s='<svg viewBox="0 0 '+W+' 330" xmlns="http://www.w3.org/2000/svg">';
  [[0,"あたためる",true],[1,"冷やす",false]].forEach(v=>{
    const cx=half/2+v[0]*half, hot=v[2];
    s+='<rect x="'+(cx-half/2+16)+'" y="26" width="'+(half-32)+'" height="278" rx="18" fill="'+(hot?"#FDF1EA":"#EFF8FD")+
       '" stroke="'+(hot?"#E0813C":"#7FB6D6")+'" stroke-width="3"/>';
    s+='<text x="'+cx+'" y="66" text-anchor="middle" font-size="26" fill="'+(hot?QRED:QBLUE)+'">'+v[1]+'</text>';
    s+=pack(cx,168);
    s+='<text x="'+(cx-30)+'" y="286" text-anchor="end" font-size="24" fill="'+QINK+'">体積は</text>';
    s+=qmark(cx+16,292,40,hot?QRED:QBLUE);
  });
  return s+'</svg>';
}

/* 実験用ガスコンロの絵（stoveFig）を、ほかの図の中にそのまま置くための部品
   tx,ty＝置く場所、k＝大きさ、lit＝火をつけるかどうか */
function stoveArt(tx,ty,k,lit){
  let inner=stoveFig().replace(/^<svg[^>]*>/,"").replace(/<\/svg>$/,"");
  inner=inner.replace('id="knob"','id="artknob"');
  inner=inner.replace('<g id="flame" style="display:none">', lit?'<g id="artflame">':'<g id="artflame" style="display:none">');
  return '<g transform="translate('+tx+','+ty+') scale('+k+')">'+inner+'</g>';
}

const GEO={"POLE": {"w": 620, "h": 561, "L": [117.4, 141.9], "R": [509.0, 147.5], "sagWinter": 141.9}, "BALL": {"w": 400, "h": 400, "cx": 200.0, "cy": 200.0, "r": 198.0}, "BOTTLE": {"w": 200, "h": 524, "left": 23.1, "right": 176.9, "top": 245.1, "bot": 405.6}, "THERMO": {"w": 168, "h": 534, "x0": 73.2, "x1": 94.2, "top": 78.0, "bulb": 439.2, "tube": "#D8E9F3", "liq": "#F5433F"}};

/* --- 円を一部へこませた形をつくる（ピンポン玉のへこみ用） ---
   ang…へこませる向き（度）  depth…へこみの深さ */
function dentGeom(cx,cy,r,ang,dd,rd){
  const a=ang*Math.PI/180, ux=Math.cos(a), uy=Math.sin(a), px=-uy, py=ux;
  const x=(dd*dd+r*r-rd*rd)/(2*dd), hh=r*r-x*x;
  if(hh<=0) return null;
  const h=Math.sqrt(hh);
  return { P1:[cx+x*ux+h*px, cy+x*uy+h*py], P2:[cx+x*ux-h*px, cy+x*uy-h*py] };
}
function circlePath(cx,cy,r){
  return 'M'+(cx-r)+' '+cy+' a'+r+' '+r+' 0 1 0 '+(2*r)+' 0 a'+r+' '+r+' 0 1 0 '+(-2*r)+' 0 Z';
}
const DENT_R=0.55;          /* へこみのまるみ（大きいほど浅く広い） */
function dentShape(cx,cy,r,ang,depth){
  const rd=r*DENT_R, dd=r+rd-depth, g=dentGeom(cx,cy,r,ang,dd,rd);
  if(!g) return circlePath(cx,cy,r);
  return 'M'+g.P1[0].toFixed(2)+' '+g.P1[1].toFixed(2)+
         ' A'+r.toFixed(2)+' '+r.toFixed(2)+' 0 1 1 '+g.P2[0].toFixed(2)+' '+g.P2[1].toFixed(2)+
         ' A'+rd.toFixed(2)+' '+rd.toFixed(2)+' 0 0 0 '+g.P1[0].toFixed(2)+' '+g.P1[1].toFixed(2)+' Z';
}
function dentEdge(cx,cy,r,ang,depth){
  const rd=r*DENT_R, dd=r+rd-depth, g=dentGeom(cx,cy,r,ang,dd,rd);
  if(!g) return 'M0 0';
  return 'M'+g.P2[0].toFixed(2)+' '+g.P2[1].toFixed(2)+
         ' A'+rd.toFixed(2)+' '+rd.toFixed(2)+' 0 0 0 '+g.P1[0].toFixed(2)+' '+g.P1[1].toFixed(2);
}
/* ピンポン玉（size…さしわたし、depth…へこみの深さ、idp…あとで動かすための名まえ） */
const BALL_ANG=-42;
function ballArt(x,y,size,depth,idp){
  const k=size/GEO.BALL.w, cx=x+GEO.BALL.cx*k, cy=y+GEO.BALL.cy*k, r=GEO.BALL.r*k;
  let s='<defs><clipPath id="'+idp+'c"><path id="'+idp+'p" d="'+
        (depth>0.5?dentShape(cx,cy,r,BALL_ANG,depth):circlePath(cx,cy,r))+'"/></clipPath></defs>';
  s+='<g clip-path="url(#'+idp+'c)"><image href="'+IMG_BALL+'" x="'+x+'" y="'+y+
     '" width="'+size+'" height="'+size+'"/></g>';
  s+='<path id="'+idp+'e" d="'+(depth>0.5?dentEdge(cx,cy,r,BALL_ANG,depth):'M0 0')+
     '" fill="none" stroke="#CE8236" stroke-width="'+Math.max(2,r*0.035).toFixed(1)+'" stroke-linecap="round"/>';
  return s;
}
function ballCircle(x,size){ const k=size/GEO.BALL.w; return {cx:x+GEO.BALL.cx*k, r:GEO.BALL.r*k}; }

/* ペットボトル（h…たての大きさ、dent…よこのへこみ、idp…名まえ） */
const BOTTLE_LINE="#21394E";
function bottleArt(x,y,h,dent,idp){
  const G=GEO.BOTTLE, k=h/G.h, w=G.w*k;
  const L=x+G.left*k, R=x+G.right*k, T=y+G.top*k, B=y+G.bot*k, mid=(T+B)/2;
  const d=dent*k, sw=Math.max(2.4,4.2*k);
  let s='<image href="'+IMG_BOTTLE+'" x="'+x+'" y="'+y+'" width="'+w.toFixed(1)+'" height="'+h+'"/>';
  /* もとのふちを白でかくしてから、へこんだふちをかき直します */
  s+='<rect x="'+(L-9*k).toFixed(1)+'" y="'+T.toFixed(1)+'" width="'+(10*k).toFixed(1)+
     '" height="'+(B-T).toFixed(1)+'" fill="#FFFFFF"/>';
  s+='<rect x="'+(R-1*k).toFixed(1)+'" y="'+T.toFixed(1)+'" width="'+(10*k).toFixed(1)+
     '" height="'+(B-T).toFixed(1)+'" fill="#FFFFFF"/>';
  s+='<path id="'+idp+'L" d="M'+L.toFixed(1)+' '+T.toFixed(1)+' Q'+(L+d).toFixed(1)+' '+mid.toFixed(1)+
     ' '+L.toFixed(1)+' '+B.toFixed(1)+'" fill="#FFFFFF" stroke="'+BOTTLE_LINE+'" stroke-width="'+sw.toFixed(1)+'"/>';
  s+='<path id="'+idp+'R" d="M'+R.toFixed(1)+' '+T.toFixed(1)+' Q'+(R-d).toFixed(1)+' '+mid.toFixed(1)+
     ' '+R.toFixed(1)+' '+B.toFixed(1)+'" fill="#FFFFFF" stroke="'+BOTTLE_LINE+'" stroke-width="'+sw.toFixed(1)+'"/>';
  return s;
}
function bottleDentD(x,y,h,dent,side){
  const G=GEO.BOTTLE, k=h/G.h;
  const L=x+G.left*k, R=x+G.right*k, T=y+G.top*k, B=y+G.bot*k, mid=(T+B)/2, d=dent*k;
  return side<0 ? 'M'+L.toFixed(1)+' '+T.toFixed(1)+' Q'+(L+d).toFixed(1)+' '+mid.toFixed(1)+' '+L.toFixed(1)+' '+B.toFixed(1)
                : 'M'+R.toFixed(1)+' '+T.toFixed(1)+' Q'+(R-d).toFixed(1)+' '+mid.toFixed(1)+' '+R.toFixed(1)+' '+B.toFixed(1);
}

/* 温度計（h…たての大きさ、lv…液の高さ 0〜1、idp…名まえ） */
function thermoLevelY(y,h,lv){
  const G=GEO.THERMO, k=h/G.h, top=y+G.top*k, bulb=y+G.bulb*k;
  return bulb-(bulb-top)*lv;
}
function thermoArt(x,y,h,lv,idp){
  const G=GEO.THERMO, k=h/G.h, w=G.w*k;
  const top=y+G.top*k, bulb=y+G.bulb*k, ly=thermoLevelY(y,h,lv);
  const X=x+G.x0*k, W=(G.x1-G.x0)*k;
  let s='<image href="'+IMG_THERMO+'" x="'+x+'" y="'+y+'" width="'+w.toFixed(1)+'" height="'+h+'"/>';
  s+='<rect id="'+idp+'e" x="'+X.toFixed(1)+'" y="'+top.toFixed(1)+'" width="'+W.toFixed(1)+
     '" height="'+(ly-top).toFixed(1)+'" fill="'+G.tube+'"/>';
  s+='<rect id="'+idp+'r" x="'+X.toFixed(1)+'" y="'+ly.toFixed(1)+'" width="'+W.toFixed(1)+
     '" height="'+(bulb-ly).toFixed(1)+'" fill="'+G.liq+'"/>';
  return s;
}
function thermoCX(x,h){ const G=GEO.THERMO, k=h/G.h; return x+(G.x0+G.x1)/2*k; }

/* ⑨ 線路（上から見た図）
   まくら木のならびと、2本のレール。レールはとちゅうで切れていて、そこがつなぎ目。 */
const RAIL_BG="#EFE7DC", RAIL_TIE="#B08C63", RAIL_TIE_L="#7A5C3F", RAIL_MET="#B7C0C7";
function railTiesAt(xs,top,h,w){
  let s='';
  xs.forEach(cx=>{
    s+='<rect x="'+(cx-w/2)+'" y="'+top+'" width="'+w+'" height="'+h+
       '" rx="6" fill="'+RAIL_TIE+'" stroke="'+RAIL_TIE_L+'" stroke-width="2.5"/>';
  });
  return s;
}
function railTies(x0,x1,top,h,step,w){
  let s='';
  for(let x=x0;x<=x1;x+=step){
    s+='<rect x="'+x+'" y="'+top+'" width="'+w+'" height="'+h+
       '" rx="6" fill="'+RAIL_TIE+'" stroke="'+RAIL_TIE_L+'" stroke-width="2.5"/>';
  }
  return s;
}

/* ============================================================
   ヒント動画（ボタンをおすと、図のところで動きます）
   HINTS[なまえ] = { dur:ながさ(ms), svg():図, step(p,root):うごき }
   p は 0→1 をくりかえします
   ============================================================ */
const HINTS={};
function hcap(x,y,t){
  return '<text id="hcap" x="'+x+'" y="'+y+'" text-anchor="middle" font-size="27" fill="'+QSOFT+'">'+t+'</text>';
}
function setcap(root,t){ const e=root.querySelector("#hcap"); if(e && e.textContent!==t) e.textContent=t; }
function hq(root,id){ return root.querySelector("#"+id); }
const ease=t=>t<0 ? 0 : t>1 ? 1 : (t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2);
const seg=(p,a,b)=>Math.max(0,Math.min(1,(p-a)/(b-a)));
const filmStyle=' fill="#BFE3F2" fill-opacity=".85" stroke="#3E9BBE" stroke-width="5" stroke-linejoin="round"';

/* ① 試験管をにぎる（手をすかして、中の空気が四方へ広がるようすを見せる） */
const HB=34;                 /* ヒントでのまくのふくらみ（大きめにしてある） */
const AIR_Y=[150,330,510];   /* 「四方へ広がる」矢じるしを出す高さ */
/* 1か所分の矢じるし（上下左右の四方向） */
function pushArrows(cx,y,k){
  const dirs=[[0,-1],[0,1],[-1,0],[1,0]];
  let s='<g id="ax'+k+'_'+y+'">';
  dirs.forEach((d,i)=>{
    s+='<g id="ar'+k+'_'+y+'_'+i+'" transform="translate(0,0)">'+
       '<path d="M'+(cx+d[0]*8)+' '+(y+d[1]*8)+' L'+(cx+d[0]*20)+' '+(y+d[1]*20)+
       '" stroke="#D0342C" stroke-width="4.5" stroke-linecap="round"/>'+
       '<path d="M'+(cx+d[0]*30)+' '+(y+d[1]*30)+
       ' L'+(cx+d[0]*18-d[1]*7)+' '+(y+d[1]*18-d[0]*7)+
       ' L'+(cx+d[0]*18+d[1]*7)+' '+(y+d[1]*18+d[0]*7)+' Z" fill="#D0342C"/></g>';
  });
  return s+'</g>';
}
HINTS.tube={
  dur:3600,
  svg(){
    const one=(cx,k)=>{
      let t=tubeBody(cx);
      t+='<rect id="hair'+k+'" x="'+(cx-31)+'" y="44" width="62" height="530" fill="#DCEFFA"/>';
      t+='<path d="M'+(cx-31)+' 574 q31 26 62 0 Z" fill="#DCEFFA"/>';
      t+='<g id="hpsh'+k+'" opacity="0">';
      AIR_Y.forEach(y=>{ t+=pushArrows(cx,y,k); });
      t+='</g>';
      t+='<g opacity=".38">'+hands(cx,false)+'</g>';
      t+='<path id="hf'+k+'" d="'+filmPath(cx,0)+'"'+filmStyle+'/>';
      return t;
    };
    let s='<svg viewBox="0 0 1100 620" xmlns="http://www.w3.org/2000/svg">';
    s+=one(190,1)+tag(60,60,"あ");
    s+=flipG(one(730,2))+tag(566,60,"い");
    s+=hcap(433,282,"にぎって");
    s+='<text id="hcap2" x="433" y="316" text-anchor="middle" font-size="27" fill="'+QSOFT+'">あたためる</text>';
    s+='<text x="433" y="374" text-anchor="middle" font-size="20" fill="'+QSOFT+'">空気は四方へ広がるので</text>';
    s+='<text x="433" y="400" text-anchor="middle" font-size="20" fill="'+QSOFT+'">まくがふくらみます</text>';
    return s+'</svg>';

  step(p,root){
    const b=HB*(0.5-0.5*Math.cos(2*Math.PI*p)), t=b/HB;
    hq(root,"hf1").setAttribute("d",filmPath(190,b));
    hq(root,"hf2").setAttribute("d",filmPath(730,b));
    /* 中の空気の色をこくして、四方への矢じるしをのばす */
    [1,2].forEach(k=>{
      hq(root,"hair"+k).setAttribute("fill",mixCol("#DCEFFA","#9CCFEA",t));
      hq(root,"hpsh"+k).setAttribute("opacity",Math.max(0,(t-0.2)/0.8).toFixed(2));
      AIR_Y.forEach(y=>{
        const g=hq(root,"ax"+k+"_"+y);
        g.setAttribute("transform","translate("+(k===1?190:730)+","+y+") scale("+(0.55+0.45*t).toFixed(3)+
                       ") translate("+(k===1?-190:-730)+","+(-y)+")");
      });
    });
    const big=t>0.45;
    setcap(root, big?"空気の体積が":"にぎって");
    const c2=hq(root,"hcap2"); if(c2) c2.textContent = big?"大きくなる":"あたためる";
  }
};

    s+='</g>';
    /* まん中へむかう矢じるし（左右から） */

                '<path d="M2 0 L-20 -12 L-20 12 Z" fill="'+QRED+'"/>';
    s+='<g id="earr" opacity="0">'+

    hq(root,"earrR").setAttribute("transform","translate("+(C+g+6).toFixed(1)+",212) scale(-1,1)");
    hq(root,"earr").setAttribute("opacity",Math.max(0,(t-0.1)/0.9).toFixed(2));
    hq(root,"ehot").setAttribute("opacity",t.toFixed(2));

function radArrows(cx,cy,r0,r1,id){
  let s='<g id="'+id+'">';

    const a=(i*60-90)*Math.PI/180, ux=Math.cos(a), uy=Math.sin(a);
    s+='<path d="M'+(cx+ux*r0).toFixed(1)+' '+(cy+uy*r0).toFixed(1)+
       ' L'+(cx+ux*r1).toFixed(1)+' '+(cy+uy*r1).toFixed(1)+
       '" stroke="'+QRED+'" stroke-width="5" stroke-linecap="round"/>';
    s+='<path d="M'+(cx+ux*(r1+18)).toFixed(1)+' '+(cy+uy*(r1+18)).toFixed(1)+
       ' L'+(cx+ux*r1-uy*10).toFixed(1)+' '+(cy+uy*r1+ux*10).toFixed(1)+
       ' L'+(cx+ux*r1+uy*10).toFixed(1)+' '+(cy+uy*r1-ux*10).toFixed(1)+' Z" fill="'+QRED+'"/>';
  }
  return s+'</g>';
}

function hintFlaskSVG(kind){

  }else{

    s+=markLine(cx,146,32);
  }
  s+='<circle cx="'+cx+'" cy="300" r="74" fill="'+(kind==="air"?"#EAF6FC":"#9CCFEA")+'" stroke="'+QINK+'" stroke-width="4"/>';
  s+='<g id="hhot">'+bowlOf(cx,266,398,true,100)+'</g>';
  s+='<g id="hcold" style="display:none">'+bowlOf(cx,266,398,false,100)+'</g>';

function hintFlaskStep(p,root,kind){
  const hot=p<0.5, q=ease(seg(p,hot?0.06:0.56,hot?0.42:0.92));
  hq(root,"hhot").style.display  = hot?"":"none";
  hq(root,"hcold").style.display = hot?"none":"";
  const d=(hot?-1:1)*58*q;
  if(kind==="air") hq(root,"hjel").setAttribute("y",(136+d).toFixed(1));
  else{
    const top=146+d;
    hq(root,"hwat").setAttribute("y",top.toFixed(1));
    hq(root,"hwat").setAttribute("height",(232-top).toFixed(1));
  }
  const what = kind==="air" ? "ゼリー" : "水面";
  setcap(root, hot ? (q>0.5 ? "体積が大きくなって、"+what+"が上へ" : "湯につける")
                   : (q>0.5 ? "体積が小さくなって、"+what+"が下へ" : "氷水につける"));
}
/* ② 空気のフラスコ（ゼリーが動く） */

/* --- タブを作る --- */
TABS.forEach(key=>{

  cur=key; idx=0; got=0;
  document.documentElement.style.setProperty("--accent",QUIZ[key].color);

    t.setAttribute("aria-selected", t.dataset.key===key ? "true":"false"));

/* --- 実験 / 問題 の切りかえ --- */
function buildSubtabs(){
  subtabsEl.innerHTML="";
  const list = QUIZ[cur].experiments ? [["exp","実験"],["quiz","問題"]] : [];
  subtabsEl.hidden = list.length===0;
  list.forEach(([k,label])=>{
    const b=document.createElement("button");
    b.className="subtab"; b.type="button"; b.dataset.view=k; b.textContent=label;
    b.addEventListener("click",()=>setView(k));

}
function setView(v){
  view=v;
  stopAnim();
  stopHintAnim(); hintOn=false;
  hideGuess();
  subtabsEl.querySelectorAll(".subtab").forEach(b=>
    b.setAttribute("aria-selected", b.dataset.view===v ? "true":"false"));
  expEl.hidden = v!=="exp";
  quizEl.hidden = v!=="quiz";
  thermoEl.style.visibility = (v==="quiz" && QUIZ[cur].questions.length) ? "visible":"hidden";
  if(v==="exp"){ expIdx=0; buildExpPicker(); showExp(); }
  else startRun(allIdx(),false);
}

function expSVG(e){
  if(e.type==="tube")   return expTubeSVG(e.dir);
  if(e.type==="wflask") return expWFlaskSVG();
  if(e.type==="stove")  return stoveFig();
  if(e.type==="ball")   return expBallSVG();

}
function showExp(){

                       : e.type==="stove"  ? "ボタンをおして、調節つまみを回してみましょう。"
                       : e.type==="ball"   ? "玉はドラッグして動かせます。輪を通るかためしてみましょう。"

/* 「氷水で冷やす」は、玉が熱くなっているときだけおせるようにする */
function updateBallActs(){
  [...expactsEl.children].forEach(b=>{
    if(b.dataset.mode==="cool"){
      b.disabled = !ballHot;
      b.title = ballHot ? "" : "先に「火であたためる」をおしましょう。";
    }
  });
}

/* 図をかく（金ぞくの玉のときは、ドラッグできるようにする） */
function drawExpFig(e){
  expfigEl.innerHTML=expSVG(e);
  if(e.type==="ball") initBallDrag();
}

/* --- 玉をドラッグして、輪を通るかためす --- */
function initBallDrag(){
  const svg=expfigEl.querySelector("svg");
  if(!svg || !expfigEl.querySelector("#ballg")) return;
  let drag=false, ox=0, oy=0;
  const at=ev=>{
    const m=svg.getScreenCTM(); if(!m) return null;
    const p = svg.createSVGPoint ? svg.createSVGPoint() : new DOMPoint();
    p.x=ev.clientX; p.y=ev.clientY;
    return p.matrixTransform(m.inverse());
  };
  svg.addEventListener("pointerdown",ev=>{
    const p=at(ev); if(!p) return;
    const c=ballCenter();
    if(Math.hypot(p.x-c[0],p.y-c[1])>ballR+20) return;   /* 玉の上でなければ何もしない */
    drag=true; ox=p.x-c[0]; oy=p.y-c[1];
    stopAnim();
    const fl=expfigEl.querySelector("#artflame"), bb=expfigEl.querySelector("#bub");
    if(fl) fl.style.display="none";
    if(bb) bb.style.display="none";
    try{ svg.setPointerCapture(ev.pointerId); }catch(err){}
    ev.preventDefault();
  });
  svg.addEventListener("pointermove",ev=>{
    if(!drag) return;
    const p=at(ev); if(!p) return;
    moveBallTo(p.x-ox,p.y-oy);
    ev.preventDefault();
  });
  const up=ev=>{
    if(!drag) return;
    drag=false;
    try{ svg.releasePointerCapture(ev.pointerId); }catch(err){}
    tellDragResult();
  };
  svg.addEventListener("pointerup",up);
  svg.addEventListener("pointercancel",up);
}
function tellDragResult(){
  const c=ballCenter(), x=c[0], y=c[1];
  let m="";
  if(ballR<=RING_IN && Math.abs(x-RING_CX)<4 && y>RING_Y+18)
    m="ふつうの大きさの玉は、輪を通りぬけました。";
  else if(ballR>RING_IN && Math.abs(x-RING_CX)<RING_OUT && y>=ballRestY(ballR)-4)
    m="あたためた玉は、輪の上でとまって通りぬけません。体積が大きくなったからです。";
  if(m){ expmsgEl.className="expmsg found"; expmsgEl.textContent="わかったこと："+m; }
}

function stopAnim(){ if(raf) cancelAnimationFrame(raf), raf=0; }
function animate(dur,step,end){
  const t0=performance.now();
  const tick=t=>{
    const p=Math.min(1,(t-t0)/dur);
    step(p);
    if(p<1) raf=requestAnimationFrame(tick); else { raf=0; end(); }
  };
  raf=requestAnimationFrame(tick);
}
/* --- 予想（実験を動かす前に、3たくで答えてもらう） --- */
function hideGuess(){ if(guessEl) guessEl.hidden=true; }
function askGuess(ai,act){
  gqEl.textContent=act.guess.q;
  gcEl.innerHTML="";
  act.guess.c.forEach((text,i)=>{
    const b=document.createElement("button");
    b.className="gchoice"; b.type="button";
    b.innerHTML='<span class="mark">'+(MARKS[i]||i+1)+'</span><span>'+text+'</span>';
    b.addEventListener("click",()=>{
      guessAns[expIdx+"_"+ai]=i;
      hideGuess();
      runAct(ai);
    });
    gcEl.appendChild(b);
  });
  guessEl.hidden=false;
  const first=gcEl.querySelector(".gchoice");
  if(first) setTimeout(()=>first.focus({preventScroll:true}),60);
}
/* 予想がまだなら先に聞く。一度答えたら、そのボタンは聞かない（「もとにもどす」でリセット） */
function startAct(ai){
  const act=QUIZ[cur].experiments[expIdx].acts[ai];
  if(act.guess && guessAns[expIdx+"_"+ai]===undefined) askGuess(ai,act);
  else runAct(ai);
}

function runAct(ai){
  const e=QUIZ[cur].experiments[expIdx], act=e.acts[ai];
  stopAnim();
  /* ガスコンロと金ぞくの玉は、前のようすから続けるので描き直さない */
  const keep = (e.type==="stove" && expfigEl.querySelector("#knob")) ||
               (e.type==="ball"  && expfigEl.querySelector("#ballg"));
  if(!keep) drawExpFig(e);
  expmsgEl.className="expmsg";
  expmsgEl.textContent="ようすを見てみましょう…";
  const done=()=>{
    expmsgEl.className="expmsg found";
    const gi=guessAns[expIdx+"_"+ai];
    /* 予想したときは、予想とけっかをならべて見せる（○×はつけない） */
    expmsgEl.innerHTML = (act.guess && gi!==undefined)
      ? '<span class="yosou">よそう：'+act.guess.c[gi]+'</span>けっか：'+act.find
      : "わかったこと："+act.find;
  };
  if(e.type==="ball"){
    /* ①火（氷水）へ運ぶ → ②あたためる（冷やす） → ③輪の上へもどす → ④輪を通してみる */
    const fl=expfigEl.querySelector("#artflame"), bub=expfigEl.querySelector("#bub");
    const heat = act.mode==="heat";
    const c0=ballCenter();
    const tx = heat?BURN_X:COOL_X, ty = heat?HEAT_Y:COOL_Y;
    const r0=ballR, r1 = heat?BALL_HOT:BALL_COLD;
    const h0 = ballHot?1:0, h1 = heat?1:0;
    const endY = heat ? ballRestY(r1) : FALL_Y;
    const seg=(p,a,b)=>Math.max(0,Math.min(1,(p-a)/(b-a)));
    const ease=t=>t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
    const arc=(x0,y0,x1,y1,q)=>moveBallTo(x0+(x1-x0)*q, y0+(y1-y0)*q-72*Math.sin(Math.PI*q), false);
    expmsgEl.textContent = heat ? "ガスコンロの火であたためています…" : "氷水で冷やしています…";
    animate(4800,p=>{
      if(p<0.24){                                     /* ① 運ぶ */
        const q=ease(seg(p,0,0.24));
        arc(c0[0],c0[1],tx,ty,q);
        if(heat && fl) fl.style.display = q>0.3 ? "" : "none";
      }else if(p<0.58){                               /* ② あたためる／冷やす */
        const q=seg(p,0.24,0.58);
        paintBall(r0+(r1-r0)*q, h0+(h1-h0)*q);
        if(!heat && bub) bub.style.display="";
      }else if(p<0.80){                               /* ③ 輪の上へもどす */
        if(fl) fl.style.display="none";
        if(bub) bub.style.display="none";
        arc(tx,ty,BX0,BY0,ease(seg(p,0.58,0.80)));
      }else{                                          /* ④ 輪を通してみる */
        moveBallTo(BX0, BY0+(endY-BY0)*ease(seg(p,0.80,1)), false);
      }
    },()=>{ ballHot=heat; updateBallActs(); done(); });
  }else if(e.type==="stove"){
    const knob=expfigEl.querySelector("#knob"), fl=expfigEl.querySelector("#flame");
    const notLit = act.needLit && stoveFl<=0;      /* まだ火がついていないとき */
    const a0=stoveAng, a1=act.ang, f0=stoveFl, f1=notLit?0:act.flame;
    animate(1100,p=>{
      const a=a0+(a1-a0)*p, f=f0+(f1-f0)*p;
      knob.setAttribute("transform","rotate("+a.toFixed(1)+" "+KX+" "+KY+")");
      fl.style.display = f>0.03 ? "" : "none";
      fl.setAttribute("transform","translate("+FX+","+FY+") scale(1,"+f.toFixed(3)+") translate(-"+FX+",-"+FY+")");
    },()=>{
      stoveAng=a1; stoveFl=f1;
      if(notLit){
        expmsgEl.className="expmsg found";
        expmsgEl.textContent="つまみは回りましたが、火はつきません。先に「点火まで回す」をおしましょう。";
      }else done();
    });
  }else if(e.type==="tube"){
    const film=expfigEl.querySelector("#film"), hand=expfigEl.querySelector("#hands");
    if(hand) hand.setAttribute("fill","#EFAE86");
    animate(2600,p=>film.setAttribute("d",filmPath(EXP_CX,EXP_BULGE*p)),done);
  }else{
    const bath=expfigEl.querySelector("#bath"), ice=expfigEl.querySelector("#ice");
    bath.setAttribute("fill",act.bath);
    if(ice) ice.style.display = act.ice ? "" : "none";
    if(e.type==="wflask"){
      const col=expfigEl.querySelector("#wcol");
      animate(2600,p=>{
        const y=WY+act.d*p;
        col.setAttribute("y",y.toFixed(1));
        col.setAttribute("height",(WB-y).toFixed(1));
      },done);
    }else{
      const jl=expfigEl.querySelector("#jelly");
      animate(2600,p=>jl.setAttribute("y",(JY+act.d*p).toFixed(1)),done);
    }
  }
}
resetBtn.addEventListener("click",showExp);

/* --- 出題する問題のならび --- */
function allIdx(){ return QUIZ[cur].questions.map((_,i)=>i); }
function startRun(list,isRetry){
  order=list.slice(); idx=0; got=0;
  missed=new Set(); retryMode=!!isRetry;
  buildTicks();
  render();
}

/* --- 温度計 --- */
function buildTicks(){
  ticksEl.innerHTML="";
  order.forEach(()=>ticksEl.appendChild(document.createElement("span")));
  updateThermo();
}
function updateThermo(){
  const n=order.length;
  mercuryEl.style.width=(n?got/n*100:0)+"%";
  countEl.textContent=got+" / "+n;
}

/* --- 問題 --- */
function render(){
  const set=QUIZ[cur], q=set.questions[order[idx]];
  const old=quizEl.querySelector(".done"); if(old) old.remove();
  cardEl.querySelector(".qhead").style.display="";
  qtextEl.style.display=""; bodyEl.style.display=""; cardEl.querySelector(".foot").style.display="";

  if(!set.questions.length) return renderEmpty();
  if(idx>=order.length || !q) return renderDone();

  qnoEl.textContent="だい "+(idx+1)+" もん";
  qtopicEl.textContent=(retryMode?"まちがえた問題":set.topic)+"　（ぜんぶで "+order.length+" もん）";
  qtextEl.innerHTML=q.q;
  figureEl.innerHTML=q.img||"";
  figureEl.style.display=q.img?"":"none";
  msgEl.className="msg"; msgEl.innerHTML="";
  nextEl.className="next";
  closeHint(false);
  hintEl.style.display = (q.hv && HINTS[q.hv]) ? "" : "none";

  choicesEl.innerHTML="";
  q.c.forEach((text,i)=>{
    const b=document.createElement("button");
    b.className="choice"; b.type="button";
    b.innerHTML='<span class="mark">'+(MARKS[i]||i+1)+'</span><span>'+text+'</span>';
    b.addEventListener("click",()=>answer(b,i,q));
    choicesEl.appendChild(b);
  });
}

function answer(btn,i,q){
  if(btn.classList.contains("wrong")) return;
  if(i===q.a){
    got++; updateThermo();
    [...choicesEl.children].forEach(c=>{c.disabled=true; if(c!==btn) c.classList.add("dim");});
    btn.classList.add("correct");
    closeHint();
    hintEl.style.display="none";
    playPinpon(); popMaru();
    msgEl.className="msg ok show";
    msgEl.innerHTML="<b>"+pick(OK_MSG)+"</b>　"+q.e;
    nextEl.textContent = (idx===order.length-1) ? "けっかを見る →" : "つぎへ →";
    nextEl.className="next show";
    setTimeout(()=>nextEl.focus({preventScroll:true}),300);
  }else{
    btn.classList.add("wrong"); btn.disabled=true;
    missed.add(order[idx]);                 /* あとで「まちがえた問題だけ」に使う */
    msgEl.className="msg ng show";
    msgEl.innerHTML=pick(NG_MSG);
  }
}

function hideQuizParts(){
  cardEl.querySelector(".qhead").style.display="none";
  qtextEl.style.display="none"; bodyEl.style.display="none";
  cardEl.querySelector(".foot").style.display="none";
}
function renderEmpty(){
  hideQuizParts();
  const d=document.createElement("div");
  d.className="done";
  d.innerHTML='<div class="big">じゅんびちゅう</div>'+
              '<div class="score">「'+QUIZ[cur].label+'」の問題は、これから入ります。</div>';
  quizEl.appendChild(d);
}
function renderDone(){
  const set=QUIZ[cur], n=order.length;
  const miss=[...missed].sort((a,b)=>a-b);      /* この回でまちがえた問題 */
  hideQuizParts();
  const d=document.createElement("div");
  d.className="done";
  d.innerHTML =
    '<div class="big">'+(miss.length===0?"ぜんもん せいかい！":"よくがんばりました！")+'</div>'+
    '<div class="score">'+(retryMode?"まちがえた問題":set.label)+'　'+
      n+'もん中 '+(n-miss.length)+'もん 1かいめで せいかい</div>';
  const btns=document.createElement("div");
  btns.className="btns";
  const again=document.createElement("button");
  again.className="again"; again.type="button"; again.textContent="はじめから もういちど";
  again.addEventListener("click",()=>startRun(allIdx(),false));
  btns.appendChild(again);
  if(miss.length){
    const re=document.createElement("button");
    re.className="again alt"; re.type="button";
    re.textContent="まちがえた問題だけ（"+miss.length+"もん）";
    re.addEventListener("click",()=>startRun(miss,true));
    btns.appendChild(re);
  }
  d.appendChild(btns);
  quizEl.appendChild(d);
}

nextEl.addEventListener("click",()=>{ idx++; render(); });
/* --- ヒント動画の さいせい --- */
let hintRAF=0, hintOn=false, hintSaved="";
function stopHintAnim(){ if(hintRAF) cancelAnimationFrame(hintRAF); hintRAF=0; }
function closeHint(restore){
  stopHintAnim();
  if(hintOn && restore!==false) figureEl.innerHTML=hintSaved;
  hintOn=false;
  hintEl.textContent="ヒント";
}
/* もとの図のわく（viewBox）を読む */
function readVB(svg){
  const m=/viewBox="([-\d.\s]+)"/.exec(svg||"");
  if(!m) return null;
  const v=m[1].trim().split(/\s+/).map(Number);
  return v.length===4 && v.every(n=>!isNaN(n)) ? v : null;
}
/* ヒントの絵を、もとの図とおなじわくの中にぴったり入れる
   （こうすると、ヒントを出しても絵の大きさが変わりません） */
function fitHint(hintSVG, box){
  const v=readVB(hintSVG);
  if(!box || !v) return hintSVG;
  const k=Math.min(box[2]/v[2], box[3]/v[3]);
  const tx=box[0]+(box[2]-v[2]*k)/2 - v[0]*k;
  const ty=box[1]+(box[3]-v[3]*k)/2 - v[1]*k;
  const inner=hintSVG.replace(/^<svg[^>]*>/,"").replace(/<\/svg>\s*$/,"");
  return '<svg viewBox="'+box.join(" ")+'" xmlns="http://www.w3.org/2000/svg">'+
         '<g transform="translate('+tx.toFixed(2)+','+ty.toFixed(2)+') scale('+k.toFixed(4)+')">'+
         inner+'</g></svg>';
}
function openHint(q){
  const H=HINTS[q.hv];
  if(!H) return;
  hintSaved=figureEl.innerHTML;
  figureEl.innerHTML=fitHint(H.svg(), readVB(hintSaved));
  figureEl.style.display="";
  hintOn=true;
  hintEl.textContent="とじる";
  const t0=performance.now();
  const tick=t=>{
    const p=((t-t0)%H.dur)/H.dur;
    try{ H.step(p,figureEl); }catch(err){}
    hintRAF=requestAnimationFrame(tick);
  };
  hintRAF=requestAnimationFrame(tick);
}
hintEl.addEventListener("click",()=>{
  const q=QUIZ[cur].questions[order[idx]];
  if(!q) return;
  if(hintOn) closeHint();
  else openHint(q);
});

function popMaru(){
  maruEl.classList.remove("pop"); void maruEl.offsetWidth; maruEl.classList.add("pop");
}
function playPinpon(){
  try{ pinpon.currentTime=0; const p=pinpon.play(); if(p&&p.catch) p.catch(()=>{}); }catch(e){}
}
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }

openTab("air");
